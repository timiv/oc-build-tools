[include klipper-readonly/bed.cfg]
[include klipper-readonly/mainboard.cfg]
[include klipper-readonly/toolhead.cfg]
[include klipper-readonly/misc.cfg]

[save_variables]
filename: /etc/klipper/config/saved_variables.cfg

[force_move]
enable_force_move: True

[include homing.cfg]
[include macros.cfg]
[include ace.cfg]

[virtual_sdcard]
path: /user-resource 
on_error_gcode:
  CANCEL_PRINT

[display_status]

[filament_switch_sensor splitter_sensor]
pause_on_runout: False
switch_pin: PC0

#[mmu_encoder hub_sensor]
#encoder_pin: PC0

[bed_mesh]
speed : 150.0
horizontal_move_z : 2.0
mesh_min : 20,20
mesh_max : 246,246
probe_count : 11,11
mesh_pps : 3,3

algorithm : bicubic
#--multi_bed_mesh_enable : 1
#--secondary_probe_count : 6,6
#--secondary_mesh_pps : 6,6
#--secondary_algorithm : lagrange
#--platform_material : standard
#--standard_z_offset : -0.000000
#--enhancement_z_offset : 0.0

#[break_save]
#break_save_path : /board-resource/
#gcode_cmds_before : M83,G92 E0, G1 Z0.28 F12000, G0 Y6 F2400,G1 X180  E40 F500 ,G1 E-2 F3000,G1 X181 F4000,G1 E-2 F2400
#gcode_cmds_after : G1 E2 F2400, M82
#save_files_num : 10
#enable : true

#--[pid_calibrate]
#--test_points : 128,128,3
#--extruder_target_temp : 220
#--heater_bed_target_temp : 60

